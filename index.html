<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TutorTrust</title>
<style>
  /* ---------- Basic look ---------- */
  :root { --brand:#3b5bdb; --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e3e7f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--text); line-height:1.4; }
  header { background:var(--brand); color:#fff; padding:20px 16px; text-align:center; }
  header h1 { margin:0 0 4px; font-size:1.6rem; }
  header p { margin:0; opacity:.85; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:1.15rem; }
  input { width:100%; padding:10px; margin-bottom:10px; border:1px solid var(--line);
          border-radius:8px; font-size:1rem; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 16px;
           font-size:.95rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.small { padding:6px 10px; font-size:.85rem; margin:2px 4px 2px 0; }
  button.danger { background:#c92a2a; }
  button.ok { background:#2b8a3e; }
  #status { padding:12px; border-radius:8px; background:#eef2ff; display:none; word-break:break-word; }
  #status.error { background:#ffe3e3; color:#8a1c1c; }
  #status.good { background:#d3f9d8; color:#1b5e20; }
  .muted { color:var(--muted); font-size:.9rem; }
  /* Table scrolls sideways on small phone screens */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:560px; }
  table.wide { min-width:900px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:.85rem; }
  .addr { font-family: ui-monospace, Consolas, monospace; font-size:.72rem; word-break:break-all; }
  .badge { padding:2px 8px; border-radius:99px; font-size:.8rem; font-weight:600; }
  .Open { background:#e7f5ff; color:#1864ab; }
  .Accepted { background:#fff3bf; color:#7c5e00; }
  .Paid { background:#d3f9d8; color:#1b5e20; }
  .Cancelled { background:#e9ecef; color:#495057; }
</style>
</head>
<body>

<header>
  <h1>TutorTrust</h1>
  <p>Peer-tutoring escrow on Ethereum Sepolia</p>
</header>

<main>
  <!-- Step 1: connect wallet -->
  <div class="card">
    <button id="connectBtn">Connect MetaMask</button>
    <span id="account" class="muted"></span>
  </div>

  <!-- Step 2: post a request -->
  <div class="card">
    <h2>Post a tutoring request</h2>
    <input id="subject" type="text" placeholder="Subject (e.g. Calculus midterm review)">
    <input id="payment" type="number" step="any" min="0" placeholder="Payment in ETH (e.g. 0.01)">
    <button id="postBtn" disabled>Post request &amp; lock payment</button>
  </div>

  <!-- Transaction status messages appear here -->
  <div class="card" id="statusCard" style="display:none"><div id="status"></div></div>

  <!-- Step 3: table of all requests -->
  <div class="card">
    <h2>All requests <button class="small" id="refreshBtn" style="float:right">Refresh</button></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Subject</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Connect your wallet to load requests.</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Step 4: every transaction ever made on this contract, read from its event log -->
  <div class="card">
    <h2>Transaction history</h2>
    <div class="table-wrap">
      <table class="wide">
        <thead><tr><th>Action</th><th>Request</th><th>From (who sent it)</th><th>To</th><th>Amount</th><th>Transaction</th></tr></thead>
        <tbody id="history"><tr><td colspan="6" class="muted">Connect your wallet to load history.</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.17.0/ethers.umd.min.js"></script>
<script>
// =====================================================================
//  EDIT ME: paste your deployed TutorTrust contract address here
// =====================================================================
const CONTRACT_ADDRESS = "0x23F8FB8e3c42E6672012D1B21d0F5e77dAE9C959";

// OPTIONAL: the block number where your contract was created (see it on Etherscan
// on the contract's creation transaction). Leave 0 to scan only the last ~200,000 blocks.
const DEPLOY_BLOCK = 0;
// =====================================================================

const SEPOLIA_CHAIN_ID = 11155111;     // Sepolia network id
const SEPOLIA_HEX      = "0xaa36a7";   // same number in hex (MetaMask wants hex)
const STATUS_NAMES = ["Open", "Accepted", "Paid", "Cancelled"]; // contract's uint8 -> words

// The "menu" of contract functions this page is allowed to call.
const ABI = [
  "function requestCount() view returns (uint256)",
  "function requests(uint256) view returns (address student, address tutor, uint256 amount, string subject, uint8 status)",
  "function postRequest(string subject) payable returns (uint256)",
  "function acceptRequest(uint256 id)",
  "function releasePayment(uint256 id)",
  "function cancelRequest(uint256 id)",
  // Events: the contract's "receipts", used to build the transaction history table
  "event RequestPosted(uint256 indexed id, address indexed student, uint256 amount, string subject)",
  "event RequestAccepted(uint256 indexed id, address indexed tutor)",
  "event PaymentReleased(uint256 indexed id, address indexed tutor, uint256 amount)",
  "event RequestCancelled(uint256 indexed id, address indexed student, uint256 amount)"
];

let provider, signer, contract, myAddress; // filled in after connecting
const $ = (id) => document.getElementById(id); // shortcut for finding page elements

// ---------- Status box helpers ----------
// kind: "" (info), "good" (success) or "error". If a txHash is given, show an Etherscan link.
function showStatus(message, kind = "", txHash = null) {
  $("statusCard").style.display = "block";
  const box = $("status");
  box.style.display = "block";
  box.className = kind;
  box.textContent = message;
  if (txHash) {
    box.append(" ");
    const a = document.createElement("a");
    a.href = "https://sepolia.etherscan.io/tx/" + txHash;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "View on Etherscan";
    box.append(a);
  }
}

// Turn a scary error object into a short, friendly sentence.
function friendlyError(err) {
  // ethers sometimes hides MetaMask's real error inside err.info.error or err.error
  const inner = (err && ((err.info && err.info.error) || err.error)) || err || {};
  const code = inner.code !== undefined ? inner.code : (err && err.code);
  if (code === "ACTION_REJECTED" || code === 4001) return "You rejected the request in MetaMask.";
  if (code === -32002) return "MetaMask already has a pending request. Open the MetaMask extension, approve or close it, then try again.";
  const short = err && err.shortMessage && !err.shortMessage.startsWith("could not coalesce") ? err.shortMessage : null;
  return (err && err.reason) || short || inner.message || "Something went wrong. Check the browser console (F12) for details.";
}

// ---------- Connect wallet ----------
async function connect() {
  if (!window.ethereum) { showStatus("MetaMask not found. Please install it first.", "error"); return; }
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);        // asks the user to approve the connection

    // Network guard: make sure we are on Sepolia, otherwise ask the wallet to switch.
    const net = await provider.getNetwork();
    if (net.chainId !== BigInt(SEPOLIA_CHAIN_ID)) {
      try {
        await provider.send("wallet_switchEthereumChain", [{ chainId: SEPOLIA_HEX }]);
      } catch (e) {
        showStatus("Please switch MetaMask to the Sepolia test network.", "error");
        return;
      }
      provider = new ethers.BrowserProvider(window.ethereum); // fresh provider on the new network
    }

    signer = await provider.getSigner();
    myAddress = (await signer.getAddress()).toLowerCase();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

    $("account").textContent = " Connected: " + myAddress.slice(0, 6) + "…" + myAddress.slice(-4);
    $("connectBtn").textContent = "Connected";
    $("postBtn").disabled = false;
    showStatus("Wallet connected on Sepolia.", "good");
    await loadRequests();
  } catch (err) {
    showStatus(friendlyError(err), "error");
  }
}

// ---------- Read all requests and draw the table ----------
async function loadRequests() {
  if (!contract) return;
  loadHistory();                       // refresh the transaction history too
  const rows = $("rows");
  try {
    // Ask the contract how many requests exist. If it has no requestCount(),
    // fall back to reading requests(0), requests(1)... until one fails.
    let count;
    try { count = Number(await contract.requestCount()); }
    catch (e) {
      count = 0;
      while (true) {
        try { await contract.requests(count); count++; } catch (e2) { break; }
      }
    }

    rows.innerHTML = "";
    if (count === 0) {
      rows.innerHTML = '<tr><td colspan="5" class="muted">No requests yet. Post the first one!</td></tr>';
      return;
    }
    for (let id = 0; id < count; id++) {
      const r = await contract.requests(id);
      rows.appendChild(buildRow(id, r));
    }
  } catch (err) {
    showStatus("Could not load requests: " + friendlyError(err), "error");
  }
}

// ---------- Transaction history (read from the contract's event log) ----------
const EVENT_LABELS = {
  RequestPosted:    "Posted (payment locked)",
  RequestAccepted:  "Accepted by tutor",
  PaymentReleased:  "Payment released",
  RequestCancelled: "Cancelled (refunded)"
};

async function loadHistory() {
  const body = $("history");
  try {
    // The wallet's network connection only allows 10,000 blocks per search,
    // so we search in chunks of 9,999 blocks and join the results.
    const latest = await provider.getBlockNumber();
    const start = DEPLOY_BLOCK > 0 ? DEPLOY_BLOCK : Math.max(0, latest - 200000);
    const ranges = [];
    for (let from = start; from <= latest; from += 10000) ranges.push([from, Math.min(from + 9999, latest)]);

    const logs = [];
    for (let i = 0; i < ranges.length; i += 5) {          // 5 chunks at a time
      const batch = await Promise.all(ranges.slice(i, i + 5).map(([f, t]) =>
        provider.getLogs({ address: CONTRACT_ADDRESS, fromBlock: f, toBlock: t })));
      batch.forEach((list) => logs.push(...list));
    }

    // Turn raw logs into readable events, oldest first.
    const events = [];
    for (const log of logs) {
      const parsed = contract.interface.parseLog(log);
      if (parsed) events.push({ log, name: parsed.name, args: parsed.args });
    }
    events.sort((a, b) => a.log.blockNumber - b.log.blockNumber || a.log.index - b.log.index);

    body.innerHTML = "";
    if (events.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="muted">No transactions found' +
        (DEPLOY_BLOCK > 0 ? "." : " in the last 200,000 blocks. Set DEPLOY_BLOCK in the code if yours is older.") + "</td></tr>";
      return;
    }

    // Look up each request and each transaction sender once, then reuse.
    const reqCache = {}, txCache = {};
    for (const { log, args } of events) {
      const id = args.id.toString();
      if (!reqCache[id]) reqCache[id] = await contract.requests(id);
      if (!txCache[log.transactionHash]) txCache[log.transactionHash] = (await provider.getTransaction(log.transactionHash)).from;
    }

    for (const { log, name, args } of events) {
      const req = reqCache[args.id.toString()];
      const sender = txCache[log.transactionHash];
      let to;
      if (name === "RequestPosted")   to = CONTRACT_ADDRESS;   // money goes into escrow
      if (name === "RequestAccepted") to = req.student;        // tutor accepts the student's request
      if (name === "PaymentReleased") to = args.tutor;         // student pays the tutor
      if (name === "RequestCancelled") to = args.student;      // refund goes back to the student
      const amount = args.amount !== undefined ? args.amount : req.amount;

      const tr = document.createElement("tr");
      const cell = (text, cls) => { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; };
      cell(EVENT_LABELS[name] || name);
      cell("#" + args.id);
      cell(sender, "addr");
      cell(to === CONTRACT_ADDRESS ? to + " (escrow contract)" : to, "addr");
      cell(ethers.formatEther(amount) + " ETH");   // exact amount, no rounding
      const link = document.createElement("a");
      link.href = "https://sepolia.etherscan.io/tx/" + log.transactionHash;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = log.transactionHash.slice(0, 10) + "…" + log.transactionHash.slice(-6);
      cell("").appendChild(link);
      body.appendChild(tr);
    }
  } catch (err) {
    body.innerHTML = "";
    const td = document.createElement("td");
    td.colSpan = 6;
    td.className = "muted";
    td.textContent = "Could not load history: " + friendlyError(err);
    const tr = document.createElement("tr");
    tr.appendChild(td);
    body.appendChild(tr);
  }
}

// Build one table row. Text goes in via textContent so nobody can inject HTML through the subject.
function buildRow(id, r) {
  const status  = STATUS_NAMES[Number(r.status)];
  const isStudent = r.student.toLowerCase() === myAddress;
  const tr = document.createElement("tr");

  const cell = (text) => { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); return td; };
  cell(id);
  cell(r.subject);
  cell(ethers.formatEther(r.amount) + " ETH");   // exact amount, no rounding
  const statusTd = cell("");
  const badge = document.createElement("span");
  badge.className = "badge " + status;
  badge.textContent = status;
  statusTd.appendChild(badge);

  // Only show the buttons this user is actually allowed to use.
  const actionsTd = cell("");
  const addBtn = (label, cls, fn) => {
    const b = document.createElement("button");
    b.className = "small " + cls;
    b.textContent = label;
    b.onclick = () => sendTx(label, () => fn(id));
    actionsTd.appendChild(b);
  };
  if (status === "Open" && !isStudent) addBtn("Accept", "", (i) => contract.acceptRequest(i));
  if (status === "Accepted" && isStudent) addBtn("Release payment", "ok", (i) => contract.releasePayment(i));
  if (status === "Open" && isStudent) addBtn("Cancel", "danger", (i) => contract.cancelRequest(i));
  return tr;
}

// ---------- Send any transaction and report progress ----------
async function sendTx(label, action) {
  try {
    showStatus(label + ": please confirm in MetaMask…");
    const tx = await action();                                   // user signs; tx is sent
    showStatus(label + ": sent, waiting for confirmation…", "", tx.hash);
    await tx.wait();                                             // wait until it is mined
    showStatus(label + ": confirmed!", "good", tx.hash);
    await loadRequests();                                        // refresh the tables
  } catch (err) {
    showStatus(label + " failed: " + friendlyError(err), "error");
  }
}

// ---------- Post a new request ----------
async function post() {
  const subject = $("subject").value.trim();
  const payment = $("payment").value.trim();
  if (!subject) { showStatus("Please enter a subject.", "error"); return; }
  let value;
  try { value = ethers.parseEther(payment); } catch (e) { showStatus("Please enter a valid ETH amount.", "error"); return; }
  if (value <= 0n) { showStatus("Payment must be greater than zero.", "error"); return; }

  await sendTx("Post request", () => contract.postRequest(subject, { value }));
  $("subject").value = "";
  $("payment").value = "";
}

// ---------- Wire up buttons ----------
$("connectBtn").onclick = connect;
$("postBtn").onclick = post;
$("refreshBtn").onclick = loadRequests;

// If the user changes account or network in MetaMask, reload to avoid stale data.
if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => location.reload());
  window.ethereum.on("chainChanged", () => location.reload());
}
</script>
</body>
</html>
